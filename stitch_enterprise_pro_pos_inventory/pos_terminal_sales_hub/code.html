<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .ripple {
            position: relative;
            overflow: hidden;
            transform: translate3d(0, 0, 0);
        }
        .ripple:after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #000 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }
        .ripple:active:after {
            transform: scale(0, 0);
            opacity: .2;
            transition: 0s;
        }
        .cart-pane-open {
            transform: translateX(0);
        }
        .cart-pane-closed {
            transform: translateX(100%);

        @media (min-width: 1024px) {
            .cart-pane-closed {

            }
        }

</button>
<script>
        // Mock Data
        const menuItems = [
            { id: 'c1', name: 'Espresso', category: 'coffee', price: 3.50, stock: 50, image: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80', imgPrompt: 'Close up shot of a rich, dark espresso shot with golden crema in a minimalist white ceramic cup, sitting on a clean concrete counter. High key lighting, modern cafe aesthetic, sharp focus.' },
            { id: 'c2', name: 'Latte', category: 'coffee', price: 4.50, stock: 30, image: 'https://images.unsplash.com/photo-1497935586351-b67a49e012bf?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80', imgPrompt: 'A smooth latte with delicate leaf latte art in a wide modern cup. Placed on a light oak wood table. Soft diffused lighting, bright and airy modern aesthetic.' },
            { id: 'c3', name: 'Cold Brew', category: 'coffee', price: 4.00, stock: 15, image: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80', imgPrompt: 'Tall glass of cold brew coffee with swirling milk and ice cubes. Condensation on the glass. Bright minimalist background, clean commercial photography style.' },
            { id: 't1', name: 'Matcha Latte', category: 'tea', price: 5.00, stock: 20, image: 'https://images.unsplash.com/photo-1515823662972-da6a2b4d3002?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80', imgPrompt: 'Vibrant green matcha latte in a clear glass mug, showing layers of milk and tea. Clean white studio background, highly detailed, soft natural lighting.' },
            { id: 't2', name: 'Earl Grey', category: 'tea', price: 3.00, stock: 40, image: 'https://images.unsplash.com/photo-1594631252845-29fc4cea8aa0?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80', imgPrompt: 'Steaming cup of amber Earl Grey tea in a simple modern glass cup. Wisps of steam rising against a pale grey background. Minimalist, calming mood, crisp focus.' },
            { id: 's1', name: 'Croissant', category: 'snacks', price: 3.50, stock: 12, image: 'https://images.unsplash.com/photo-1555507036-ab1e4006a8a0?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80', imgPrompt: 'Flaky, golden brown butter croissant on a small matte black slate plate. High contrast lighting highlighting the texture. Professional bakery photography style.' },
            { id: 's2', name: 'Blueberry Muffin', category: 'snacks', price: 3.00, stock: 0, image: 'https://images.unsplash.com/photo-1607958996333-41aef7caefaa?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80', imgPrompt: 'A freshly baked blueberry muffin with a crumb topping, overflowing with berries. Clean, bright kitchen counter setting. Warm, appetizing lighting.' },
            { id: 'm1', name: 'Avocado Toast', category: 'meals', price: 8.50, stock: 8, image: 'https://images.unsplash.com/photo-1603048297172-c92544798d5e?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80', imgPrompt: 'Artisanal avocado toast on thick sourdough bread, garnished with red pepper flakes and microgreens. Top-down view on a light marble surface. Bright, contemporary food styling.' }
        ];

        let cart = {};

        // DOM Elements
        const menuGrid = document.getElementById('menuGrid');
        const categoryTabs = document.querySelectorAll('.category-btn');
        const searchInput = document.getElementById('searchInput');
        
        // Render Menu Cards
        function renderMenu(items) {
            menuGrid.innerHTML = '';
            items.forEach(item => {
                const stockStatus = item.stock > 0 
                    ? `<span class="bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded-sm font-label-md text-[10px] uppercase">In Stock (${item.stock})</span>`
                    : `<span class="bg-error-container text-on-error-container px-2 py-0.5 rounded-sm font-label-md text-[10px] uppercase">Out of Stock</span>`;
                
                const cardClass = item.stock > 0 
                    ? 'cursor-pointer hover:shadow-[rgba(0,0,0,0.1)_0px_12px_24px] active:scale-[0.98]' 
                    : 'opacity-60 grayscale cursor-not-allowed';

                const card = document.createElement('div');
                card.className = `bg-surface rounded-xl overflow-hidden shadow-[rgba(0,0,0,0.05)_0px_4px_12px] border border-outline-variant/30 flex flex-col h-full transition-all duration-200 ${cardClass}`;
                if(item.stock > 0) {
                    card.onclick = () => addToCart(item);
                }

                card.innerHTML = `
                    <div class="h-32 bg-surface-variant relative overflow-hidden">
                        <img src="${item.image}" alt="${item.name}" data-alt="${item.imgPrompt}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105">
                        <div class="absolute bottom-2 right-2 flex flex-col gap-1 items-end">
                            ${stockStatus}
                        </div>
                    </div>
                    <div class="p-3 flex flex-col flex-1 justify-between">
                        <div>
                            <h3 class="font-body-lg text-body-lg font-bold text-on-surface line-clamp-2 leading-tight">${item.name}</h3>
                        </div>
                        <div class="mt-2 flex items-center justify-between">
                            <span class="font-numeric-data text-numeric-data text-primary">$${item.price.toFixed(2)}</span>
                            ${item.stock > 0 ? '<button class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center hover:bg-primary hover:text-on-primary transition-colors"><span class="material-symbols-outlined text-[20px]">add</span></button>' : ''}
                        </div>
                    </div>
                `;
                menuGrid.appendChild(card);
            });
        }

        // Initial Render
        renderMenu(menuItems);

        // Category Filtering
        categoryTabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                // Update active state
                categoryTabs.forEach(t => {
                    t.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary');
                    t.classList.add('border-outline', 'text-on-surface-variant');
                });
                e.target.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
                e.target.classList.remove('border-outline', 'text-on-surface-variant');

                const category = e.target.dataset.category;
                const filtered = category === 'all' ? menuItems : menuItems.filter(i => i.category === category);
                renderMenu(filtered);
                searchInput.value = ''; // clear search on category change
            });
        });

        // Search Filtering
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = menuItems.filter(i => i.name.toLowerCase().includes(query));
            renderMenu(filtered);
            
            // Reset category tabs visual state
            categoryTabs.forEach(t => {
                t.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary');
                t.classList.add('border-outline', 'text-on-surface-variant');
            });
            categoryTabs[0].classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
            categoryTabs[0].classList.remove('border-outline', 'text-on-surface-variant');
        });

        // Cart Logic
        function addToCart(item) {
            if (!cart[item.id]) {
                cart[item.id] = { ...item, quantity: 1 };
            } else {
                if(cart[item.id].quantity < item.stock) {
                    cart[item.id].quantity++;
                }
            }
            updateCartUI();
            
            // Visual feedback on FAB
            const fab = document.getElementById('fabCartToggle');
            fab.classList.add('scale-110');
            setTimeout(() => fab.classList.remove('scale-110'), 200);
        }

        function removeFromCart(itemId) {
            delete cart[itemId];
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById('cartList');
            const emptyState = document.getElementById('emptyCartState');
            const cartItems = Object.values(cart);
            
            let subtotal = 0;
            let totalItems = 0;

            if (cartItems.length === 0) {
                cartList.classList.add('hidden');
                emptyState.classList.remove('hidden');
                document.getElementById('checkoutBtn').disabled = true;
            } else {
                cartList.classList.remove('hidden');
                emptyState.classList.add('hidden');
                document.getElementById('checkoutBtn').disabled = false;
                
                cartList.innerHTML = '';
                cartItems.forEach(item => {
                    subtotal += item.price * item.quantity;
                    totalItems += item.quantity;
                    
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center bg-surface-container-lowest p-2 rounded-lg border border-outline-variant/30';
                    li.innerHTML = `
                        <div class="flex flex-col">
                            <span class="font-body-md text-body-md font-bold text-on-surface">${item.name}</span>
                            <span class="font-label-md text-label-md text-on-surface-variant">${item.quantity} x $${item.price.toFixed(2)}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-numeric-data text-numeric-data font-bold text-primary mr-2">$${(item.price * item.quantity).toFixed(2)}</span>
                            <button onclick="removeFromCart('${item.id}')" class="text-error hover:bg-error-container p-1 rounded-full transition-colors">
                                <span class="material-symbols-outlined text-[18px]">delete</span>
                            </button>
                        </div>
                    `;
                    cartList.appendChild(li);
                });
            }

            const tax = subtotal * 0.08;
            const total = subtotal + tax;

            document.getElementById('cartSubtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('cartTax').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
            
            // Update mobile badges
            const mobBadge = document.getElementById('mobileCartCount');
            const fabBadge = document.getElementById('fabCartCount');
            
            mobBadge.textContent = totalItems;
            fabBadge.textContent = totalItems;
            
            if(totalItems > 0) {
                mobBadge.classList.remove('hidden');
                fabBadge.classList.remove('hidden');
            } else {
                mobBadge.classList.add('hidden');
                fabBadge.classList.add('hidden');
            }
        }

        // Mobile Cart Drawer Toggle
        const cartPane = document.getElementById('cartPane');
        const toggleBtns = [document.getElementById('mobileCartToggle'), document.getElementById('fabCartToggle')];
        const closeBtn = document.getElementById('closeCartBtn');

        toggleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                cartPane.classList.remove('cart-pane-closed');
                cartPane.classList.add('cart-pane-open');
            });
        });

        closeBtn.addEventListener('click', () => {
            cartPane.classList.add('cart-pane-closed');
            cartPane.classList.remove('cart-pane-open');
        });

    </script>
</body></html>
